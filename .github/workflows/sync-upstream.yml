name: Sync fork with upstream

# Keeps this fork's master current with PokeAPI/sprites so PKMDS-Blazor (which serves
# sprites from this fork via jsDelivr) keeps receiving new-gen sprites and upstream fixes.
# Runs daily and can be triggered manually.

on:
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Never run two syncs at once.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync master from PokeAPI/sprites
        env:
          # The built-in GITHUB_TOKEN cannot update files under .github/workflows.
          # This fine-grained token is scoped to this repository with Contents and Workflows write access.
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        # Calls the same "Sync fork" merge-upstream API as the GitHub UI button. It fast-forwards
        # when possible, otherwise merges upstream in — which is what we need, since master carries
        # our own commits that upstream doesn't have. A 409 here means a fork edit collided with an
        # upstream change and the sync should be resolved by hand. --silent discards the JSON body;
        # the step still fails on a non-2xx status.
        run: gh api --method POST "repos/${{ github.repository }}/merge-upstream" -f branch=master --silent
